# fly.toml app configuration file generated for bt-servant on 2025-10-17T15:17:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bt-servant'
primary_region = 'iad'

[build]

[env]
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = "data_volume"
  destination = "/data"
